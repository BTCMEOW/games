<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOW WARS: Street Riot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#02040A;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;font-family:'Share Tech Mono',monospace}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,245,255,0.015) 3px,rgba(0,245,255,0.015) 4px);pointer-events:none;z-index:10}
#wrapper{position:relative;border:1px solid rgba(0,245,255,0.25);box-shadow:0 0 60px rgba(0,245,255,0.08),0 0 120px rgba(0,0,0,0.9);border-radius:6px;overflow:hidden}
canvas{display:block}
#title-bar{background:#060c18;border-bottom:1px solid rgba(0,245,255,0.15);padding:6px 16px;display:flex;align-items:center;justify-content:space-between}
.gname{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#39FF14,#00F5FF,#BF5FFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gsub{font-size:9px;letter-spacing:3px;color:rgba(0,245,255,0.4);text-transform:uppercase}
</style>
</head>
<body>
<div id="wrapper">
  <div id="title-bar">
    <div class="gname">⚡ MEOW WARS</div>
    <div class="gsub">Street Riot · Beat-em-up</div>
    <div class="gsub" style="color:rgba(255,215,0,0.4)">A/D:MOVE · W/↑:JUMP · J:PUNCH · K:KICK · L:SPECIAL</div>
  </div>
  <canvas id="game"></canvas>
</div>
<script>
'use strict';
/* =============================================
   MEOW WARS: STREET RIOT
   Anthropomorphic cat beat-em-up
   ============================================= */

// ─── SETUP ───────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 900, H = 480;
canvas.width = W; canvas.height = H;

const GY = 400; // ground y
const GRAV = 0.55;
const PSPD = 4.2;
const JF = -13.5;

// ─── POLYFILL roundRect ───────────────────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.beginPath();
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}

// ─── INPUT ───────────────────────────────────
const keys={}, jp={};
window.addEventListener('keydown',e=>{
  if(!keys[e.code])jp[e.code]=true;
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.code]=false});

// ─── UTILS ───────────────────────────────────
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
let screenShake=0;

// ─── PRE-COMPUTE BUILDING LAYOUT ─────────────
const BUILDINGS=[];
{
  const seed=[55,82,46,91,67,38,74,58,49,86,62,71,43,79,53,68];
  let bx=0;
  for(let i=0;i<32;i++){
    const w=44+seed[i%seed.length];
    const bh=70+seed[(i+3)%seed.length]*1.2;
    const c=['rgba(0,15,25,0.95)','rgba(5,10,20,0.95)','rgba(0,8,18,0.95)'][i%3];
    BUILDINGS.push({x:bx,w:w-3,h:bh,c});
    bx+=w;
  }
}
const BLDG_TOTAL=BUILDINGS.reduce((s,b)=>s+b.w+3,0);

// ─── PARTICLES ───────────────────────────────
const parts=[];
// shape: 'circle'|'spark'|'ring'|'star'
function spawnParts(x,y,col,n,spd=4,shape='circle'){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2),s=rnd(1,spd);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,dec:rnd(0.03,0.07),col,sz:rnd(2,5),shape:shape||'circle',rot:rnd(0,Math.PI*2)});
  }
}
// Spark slash effect – directional burst
function spawnSlash(x,y,col,dir){
  for(let i=0;i<12;i++){
    const a=rnd(-0.7,0.7);
    const s=rnd(4,11);
    parts.push({x,y,vx:dir*Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,dec:rnd(0.07,0.14),col,sz:rnd(2,4),shape:'spark',rot:a});
  }
  // ring pulse
  parts.push({x,y,vx:0,vy:0,life:1,dec:0.09,col,sz:24,shape:'ring',rot:0});
}
// Ultra burst
function spawnUltra(x,y){
  const cols=['#39FF14','#FFD700','#00F5FF','#BF5FFF'];
  for(let i=0;i<60;i++){
    const a=rnd(0,Math.PI*2),s=rnd(2,14);
    const c=cols[i%cols.length];
    parts.push({x,y:y-42,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,life:1,dec:rnd(0.025,0.055),col:c,sz:rnd(3,8),shape:i%6===0?'star':'circle',rot:rnd(0,Math.PI*2)});
  }
  // shockwave rings
  for(let r=0;r<3;r++){
    parts.push({x,y:y-42,vx:0,vy:0,life:1-r*0.15,dec:0.05,col:'#39FF14',sz:30+r*20,shape:'ring',rot:0});
  }
}
function updateParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx;p.y+=p.vy;
    if(p.shape!=='ring'){p.vy+=0.16;p.vx*=0.97;}
    p.life-=p.dec;
    if(p.life<=0)parts.splice(i,1);
  }
}
function drawStar(cx,cy,r,pts,rot){
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const rad=i%2===0?r:r*0.45;
    const ang=rot+i*Math.PI/pts;
    i===0?ctx.moveTo(cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad):ctx.lineTo(cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad);
  }
  ctx.closePath();ctx.fill();
}
function drawParts(){
  for(const p of parts){
    ctx.globalAlpha=p.life*p.life;
    ctx.shadowColor=p.col;ctx.shadowBlur=8;
    if(p.shape==='ring'){
      ctx.strokeStyle=p.col;ctx.lineWidth=2+p.life*3;
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(2-p.life),0,Math.PI*2);ctx.stroke();
    }else if(p.shape==='spark'){
      ctx.fillStyle=p.col;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillRect(-p.sz*p.life*3,-p.sz*p.life*0.5,p.sz*p.life*3,p.sz*p.life*0.5);
      ctx.restore();
    }else if(p.shape==='star'){
      ctx.fillStyle=p.col;
      drawStar(p.x,p.y,p.sz*p.life,5,p.rot+p.life*2);
    }else{
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}

// ─── DAMAGE NUMBERS ───────────────────────────
const dmgN=[];
function spawnDmg(x,y,txt,col){dmgN.push({x,y,txt,col,life:1,vy:-2.2});}
function updateDmgN(){for(let i=dmgN.length-1;i>=0;i--){const d=dmgN[i];d.y+=d.vy;d.life-=0.025;if(d.life<=0)dmgN.splice(i,1);}}
function drawDmgN(){
  ctx.save();ctx.textAlign='center';
  for(const d of dmgN){
    ctx.globalAlpha=d.life;
    ctx.font=`bold ${14+Math.floor((1-d.life)*4)}px 'Orbitron',monospace`;
    ctx.fillStyle=d.col;ctx.shadowColor=d.col;ctx.shadowBlur=12;
    ctx.fillText(d.txt,d.x,d.y);
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
}

// ─── DRAWING HELPERS ─────────────────────────
function glow(col,b=10){ctx.shadowColor=col;ctx.shadowBlur=b;}
function noGlow(){ctx.shadowBlur=0;}

// ─── CHARACTER DRAWING FUNCTIONS ─────────────
// All characters: feet at local y=0, head top ~y=-92

function getWalk(f,sp=0.14){
  const t=f*sp;
  return{lL:Math.sin(t)*0.38,rL:Math.sin(t+Math.PI)*0.38,lA:Math.sin(t+Math.PI)*0.28,rA:Math.sin(t)*0.28,bob:Math.abs(Math.sin(t))*2};
}
function getIdle(f){
  const t=f*0.05;
  return{lL:0,rL:0,lA:Math.sin(t)*0.05,rA:-Math.sin(t)*0.05,bob:Math.sin(t)*1.5};
}

// ═══ CAT HERO ════════════════════════════════
function drawCat(x,y,dir,state,f){
  ctx.save();ctx.translate(x,y);ctx.scale(dir,1);
  const t=f*0.1;
  let a={lL:0,rL:0,lA:0,rA:0,bob:0,punch:0,kick:0,kickPhase:0,punchPhase:0,special:0};
  if(state==='walk'){Object.assign(a,getWalk(f));}
  else if(state==='idle'){Object.assign(a,getIdle(f));}
  else if(state==='jump'){a.lL=-0.4;a.rL=0.4;a.lA=-0.3;a.rA=0.3;}
  else if(state==='hurt'){a.rA=0.5;a.lA=-0.3;a.bob=-3;}
  else if(state==='atk1'){
    const fp=(f%16)/16;const p=fp<0.45?fp/0.45:1-(fp-0.45)/0.55;
    a.punchPhase=p;a.rA=-p*1.1;a.punch=p;a.lA=0.18+p*0.12;a.bob=p*-3;
  }else if(state==='atk2'){
    const fp=(f%16)/16;const p=fp<0.4?fp/0.4:1-(fp-0.4)/0.6;
    a.punchPhase=p;a.rA=-0.35-p*0.85;a.punch=p*0.85;a.lA=0.1;a.bob=p*-4;
  }else if(state==='atk3'){
    const fp=(f%16)/16;const p=Math.sin(fp*Math.PI);
    a.punchPhase=p;a.rA=-1.3+p*0.4;a.punch=p;a.lA=0.3;a.bob=-5*p;
  }else if(state==='kick'){
    const fp=(f%22)/22;let kp;
    if(fp<0.22){kp=-(fp/0.22)*0.35;}
    else if(fp<0.62){kp=(fp-0.22)/0.40;}
    else{kp=1-(fp-0.62)/0.38;}
    a.kick=Math.max(0,kp);a.kickPhase=kp;
    a.rL=kp*-1.4;a.lL=Math.max(0,kp)*0.18;a.lA=Math.max(0,kp)*0.35;a.bob=Math.max(0,kp)*-4;
  }else if(state==='special'){
    const fp=(f%32)/32;const p=Math.sin(fp*Math.PI*2)*0.5+0.5;
    a.special=p;a.rA=-1.1-Math.sin(fp*Math.PI*2)*0.4;a.lA=0.7+Math.sin(fp*Math.PI*2)*0.3;
    a.bob=-4-Math.sin(fp*Math.PI*4)*3;a.rL=-0.3*p;a.lL=0.2*p;
  }
  const b=a.bob;

  // Shadow
  ctx.fillStyle=a.special>0?'rgba(57,255,20,0.22)':'rgba(57,255,20,0.12)';
  ctx.beginPath();ctx.ellipse(0,1,a.special>0?22:18,5,0,0,Math.PI*2);ctx.fill();
  // Tail – wilder during special
  glow('#39FF14',5);ctx.strokeStyle='#39FF14';ctx.lineWidth=3;
  const tailSwing=a.special>0?Math.sin(t*2.5)*14:Math.sin(t*0.8)*8;
  ctx.beginPath();ctx.moveTo(-5,-32+b);
  ctx.bezierCurveTo(-16,-14+b,-26+tailSwing,4,-18,10);ctx.stroke();noGlow();
  // Left leg
  ctx.save();ctx.translate(-8,-32+b);ctx.rotate(a.lL);
  ctx.fillStyle='#0a2010';ctx.strokeStyle='#39FF14';ctx.lineWidth=0.9;
  glow('#39FF14',3);ctx.roundRect(-5,0,10,26,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#142818';ctx.roundRect(-6,22,13,7,3);ctx.fill();ctx.stroke();noGlow();
  ctx.restore();
  // Kick arc trail (before leg so leg renders on top)
  if(a.kick>0.45){
    ctx.save();
    for(let tr=1;tr<=3;tr++){
      ctx.globalAlpha=(0.06*(4-tr))*a.kick;
      ctx.strokeStyle='#39FF14';ctx.lineWidth=8;glow('#39FF14',6);
      ctx.save();ctx.translate(8,-32+b);ctx.rotate(a.rL-tr*0.18);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,26);ctx.stroke();ctx.restore();
    }
    ctx.globalAlpha=a.kick*0.5;
    ctx.strokeStyle='#39FF14';ctx.lineWidth=2;glow('#39FF14',16);
    ctx.beginPath();ctx.arc(8,-32+b,30,Math.PI*0.55+a.rL-0.3,Math.PI*0.55+a.rL+0.45);ctx.stroke();
    noGlow();ctx.restore();
  }
  // Right leg
  ctx.save();ctx.translate(8,-32+b);ctx.rotate(a.rL);
  ctx.fillStyle='#0a2010';ctx.strokeStyle='#39FF14';ctx.lineWidth=0.9;
  ctx.roundRect(-5,0,10,26,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#142818';
  const kickGlowing=a.kick>0.35;
  if(kickGlowing){glow('#39FF14',18+a.kick*14);}
  ctx.roundRect(-6,22,14,7,3);ctx.fill();ctx.stroke();
  if(kickGlowing){ctx.globalAlpha=a.kick*0.45;ctx.fillStyle='rgba(57,255,20,0.35)';ctx.beginPath();ctx.ellipse(1,26,10,7,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  noGlow();ctx.restore();
  // Torso
  ctx.fillStyle='#060f08';glow('#39FF14',a.special>0?20:9);ctx.strokeStyle='#39FF14';ctx.lineWidth=1.3;
  ctx.roundRect(-15,-60+b,30,30,5);ctx.fill();ctx.stroke();noGlow();
  // Chest panels
  ctx.fillStyle='#0d2a10';ctx.strokeStyle='rgba(57,255,20,0.5)';ctx.lineWidth=0.6;
  ctx.roundRect(-14,-58+b,12,11,2);ctx.fill();ctx.stroke();
  ctx.roundRect(2,-58+b,12,11,2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#39FF14';glow('#39FF14',7);ctx.roundRect(-4,-53+b,8,2,1);ctx.fill();noGlow();
  // Left arm
  ctx.save();ctx.translate(-15,-56+b);ctx.rotate(a.lA);
  ctx.fillStyle='#0a2010';ctx.strokeStyle='#39FF14';ctx.lineWidth=0.9;
  ctx.roundRect(-9,0,9,20,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#172e1a';ctx.beginPath();ctx.arc(-5,22,6,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.restore();
  // Right arm – punch with motion trails + glowing fist
  if(a.punchPhase>0.28){
    ctx.save();
    for(let tr=1;tr<=3;tr++){
      ctx.globalAlpha=0.07*(4-tr)*a.punchPhase;ctx.fillStyle='#39FF14';
      ctx.save();ctx.translate(15,-56+b);ctx.rotate(a.rA+tr*0.12);
      ctx.roundRect(-1,0,9,20+a.punch*9,4);ctx.fill();ctx.restore();
    }
    ctx.restore();
  }
  ctx.save();ctx.translate(15,-56+b);ctx.rotate(a.rA);
  ctx.fillStyle='#0a2010';ctx.strokeStyle='#39FF14';ctx.lineWidth=0.9;
  const punchExt=a.punch*10;
  ctx.roundRect(-1,0,9,20+punchExt,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#172e1a';
  const fistGlowing=a.punchPhase>0.38;
  if(fistGlowing){glow('#39FF14',16+a.punchPhase*16);}
  const fistR=6+a.punchPhase*2.5;
  ctx.beginPath();ctx.arc(3,22+punchExt,fistR,0,Math.PI*2);ctx.fill();ctx.stroke();
  if(fistGlowing){ctx.globalAlpha=a.punchPhase*0.5;ctx.fillStyle='rgba(57,255,20,0.45)';ctx.beginPath();ctx.arc(3,22+punchExt,fistR+5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  noGlow();ctx.restore();
  // Special – orbiting energy balls
  if(a.special>0){
    ctx.save();
    const orbitCols=['#39FF14','#FFD700','#00F5FF'];
    for(let ring=0;ring<3;ring++){
      const rt=t*2.5+ring*Math.PI*2/3;
      const rx=Math.cos(rt)*26,ry=Math.sin(rt)*14-44+b;
      ctx.globalAlpha=0.65*a.special;ctx.fillStyle=orbitCols[ring];
      glow(orbitCols[ring],14);
      ctx.beginPath();ctx.arc(rx,ry,4+ring,0,Math.PI*2);ctx.fill();
      for(let tr=1;tr<=3;tr++){const trt=rt-tr*0.18;ctx.globalAlpha=0.12*(4-tr)*a.special;ctx.beginPath();ctx.arc(Math.cos(trt)*26,Math.sin(trt)*14-44+b,3,0,Math.PI*2);ctx.fill();}
    }
    noGlow();ctx.restore();
  }
  // HEAD
  ctx.save();ctx.translate(0,-72+b);
  // Neck
  ctx.fillStyle='#0a2010';ctx.roundRect(-5,0,10,12,3);ctx.fill();
  // Head base
  ctx.fillStyle='#0d2a10';glow('#39FF14',10);ctx.strokeStyle='#39FF14';ctx.lineWidth=1.1;
  ctx.beginPath();ctx.ellipse(0,-10,15,14,0,0,Math.PI*2);ctx.fill();ctx.stroke();noGlow();
  // Left ear
  ctx.fillStyle='#0d2a10';ctx.strokeStyle='#39FF14';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-15,-18);ctx.lineTo(-8,-28);ctx.lineTo(-4,-18);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(57,255,20,0.25)';ctx.beginPath();ctx.moveTo(-12,-18);ctx.lineTo(-8,-25);ctx.lineTo(-5,-18);ctx.closePath();ctx.fill();
  // Right ear
  ctx.fillStyle='#0d2a10';ctx.strokeStyle='#39FF14';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(15,-18);ctx.lineTo(8,-28);ctx.lineTo(4,-18);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(57,255,20,0.25)';ctx.beginPath();ctx.moveTo(12,-18);ctx.lineTo(8,-25);ctx.lineTo(5,-18);ctx.closePath();ctx.fill();
  // Goggles
  ctx.fillStyle='#001200';glow('#39FF14',a.special>0?22:8);ctx.strokeStyle='#39FF14';ctx.lineWidth=1.2;
  ctx.roundRect(-14,-17,11,7,3);ctx.fill();ctx.stroke();
  ctx.roundRect(3,-17,11,7,3);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#39FF14';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-3,-13);ctx.lineTo(3,-13);ctx.stroke();noGlow();
  ctx.fillStyle=a.special>0?'rgba(57,255,20,0.65)':'rgba(57,255,20,0.22)';ctx.roundRect(-13,-16,9,5,2);ctx.fill();ctx.roundRect(4,-16,9,5,2);ctx.fill();
  // Nose
  ctx.fillStyle='#F9A8D4';ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(-2.5,-3.5);ctx.lineTo(2.5,-3.5);ctx.closePath();ctx.fill();
  // Mouth
  ctx.strokeStyle='rgba(57,255,20,0.5)';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(-3,-1.5);ctx.quadraticCurveTo(0,1,3,-1.5);ctx.stroke();
  // Whiskers
  ctx.strokeStyle='rgba(57,255,20,0.35)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(-15,-9);ctx.lineTo(-5,-8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-15,-5.5);ctx.lineTo(-5,-5.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(15,-9);ctx.lineTo(5,-8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(15,-5.5);ctx.lineTo(5,-5.5);ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// ═══ RAT ══════════════════════════════════════
function drawRat(x,y,dir,state,f){
  ctx.save();ctx.translate(x,y);ctx.scale(dir,1);
  const t=f*0.1;
  let a={lL:0,rL:0,lA:0,rA:0,bob:0};
  if(state==='chase')Object.assign(a,getWalk(f,0.18));
  else if(state==='idle')Object.assign(a,getIdle(f));
  else if(state==='atk'){a.rA=-1.0;a.bob=-2;}
  else if(state==='hurt'){a.bob=-3;a.lA=0.5;}
  const b=a.bob;
  // Shadow
  ctx.fillStyle='rgba(255,107,0,0.1)';ctx.beginPath();ctx.ellipse(0,1,16,5,0,0,Math.PI*2);ctx.fill();
  // Tail
  glow('#FF6B00',4);ctx.strokeStyle='#FF6B00';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-5,-25+b);ctx.bezierCurveTo(-20,-8+b,-24+Math.sin(t*0.7)*8,6,-16,12);ctx.stroke();noGlow();
  // Legs
  for(const[ox,rot]of[[-7,a.lL],[7,a.rL]]){
    ctx.save();ctx.translate(ox,-28+b);ctx.rotate(rot);
    ctx.fillStyle='#200a00';ctx.strokeStyle='#FF6B00';ctx.lineWidth=0.8;
    ctx.roundRect(-5,0,10,22,3);ctx.fill();ctx.stroke();
    ctx.fillStyle='#2e1200';ctx.roundRect(-6,18,12,7,2);ctx.fill();ctx.stroke();
    ctx.restore();
  }
  // Torso – leather jacket
  ctx.fillStyle='#160500';glow('#FF6B00',7);ctx.strokeStyle='#FF6B00';ctx.lineWidth=1.1;
  ctx.roundRect(-14,-55+b,28,28,4);ctx.fill();ctx.stroke();noGlow();
  // Lapels
  ctx.fillStyle='#240900';ctx.beginPath();ctx.moveTo(-14,-55+b);ctx.lineTo(0,-46+b);ctx.lineTo(-14,-27+b);ctx.closePath();ctx.fill();

// ═══ CROW ═════════════════════════════════════
function drawCrow(x,y,dir,state,f){

  else if(state==='idle'){Object.assign(a,getIdle(f));a.wf=Math.sin(t*0.5)*0.15;}
  else if(state==='atk'){a.rA=-0.7;a.wf=0.5;a.bob=-2;}
  else if(state==='hurt'){a.bob=-4;a.wf=0.8;}

  ctx.fill();ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(6,-52+b);ctx.rotate(0.3+a.wf);
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(20,5,26,18,18,28);ctx.bezierCurveTo(10,22,0,14,0,0);
  ctx.fill();ctx.stroke();ctx.restore();noGlow();
  // Bird legs
  for(const[ox,rot]of[[-5,a.lL],[5,a.rL]]){

    ctx.roundRect(isR?-2:-7,0,8,16,3);ctx.fill();ctx.stroke();
    const hx=isR?1:-3,hy=18;
    ctx.lineWidth=1.1;

    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx,hy+6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+3,hy+5);ctx.stroke();
    ctx.restore();

  // Crow head
  ctx.save();ctx.translate(0,-64+b);
  ctx.fillStyle='#001520';glow('#00F5FF',8);ctx.strokeStyle='#00F5FF';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,-8,12,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();noGlow();
  // Crown feathers

  ctx.fillStyle='#00F5FF';glow('#00F5FF',10);

  ctx.bezierCurveTo(10,-24,0,-28,-10,-24);ctx.closePath();ctx.fill();ctx.stroke();noGlow();
  ctx.fillStyle='rgba(74,222,128,0.12)';ctx.beginPath();ctx.ellipse(0,-24,9,5,0,0,Math.PI*2);ctx.fill();
  // Slit eyes
  ctx.fillStyle='#4ade80';glow('#4ade80',10);
  ctx.beginPath();ctx.ellipse(-4,-12,3,3,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(4,-12,3,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(-4,-12,1,2.5,0,0,Math.PI*2);ctx.fill();

// ─── PLAYER ───────────────────────────────────
class Player{
  constructor(){this.reset();}
  reset(){
    this.x=140;this.y=GY;this.vx=0;this.vy=0;
    this.hp=100;this.maxHp=100;this.dir=1;
    this.state='idle';this.frame=0;
    this.grounded=true;this.dead=false;
    this.atkTimer=0;this.atkDur=18;this.atkCD=0;
    this.atkType=null;this.hitSet=new Set();
    this.hurtTimer=0;this.iframes=0;
    this.combo=0;this.comboTimer=0;
    this.sp=0;this.maxSp=100;this.spActive=false;this.spTimer=0;this.spCD=0;
    this.score=0;
  }
  get attacking(){return this.atkTimer>0;}
  get hurt(){return this.hurtTimer>0;}
  hitbox(){
    if(!this.attacking)return null;
    const prog=1-(this.atkTimer/this.atkDur);
    if(prog<0.18||prog>0.82)return null;
    let w=38,h=22,ox=14,oy=-65;
    if(this.atkType==='kick'){w=44;h=22;ox=14;oy=-42;}
    if(this.atkType==='special'){w=90;h=90;ox=8;oy=-90;}
    const hx=this.dir===1?this.x+ox:this.x-ox-w;
    return{x:hx,y:this.y+oy,w,h};
  }
  takeDmg(amt){
    if(this.iframes>0||this.dead)return;
    this.hp=Math.max(0,this.hp-amt);
    this.hurtTimer=22;this.iframes=45;
    this.vx=-this.dir*3;
    screenShake=Math.max(screenShake,7);
    spawnParts(this.x,this.y-50,'#FF2E4C',12,5,'circle');spawnParts(this.x,this.y-50,'#FF6B00',6,8,'spark');
    spawnDmg(this.x,this.y-95,`-${amt}`,'#FF2E4C');
    if(this.hp<=0)this.dead=true;
  }
  update(enemies){
    this.frame++;
    if(this.atkCD>0)this.atkCD--;
    if(this.atkTimer>0)this.atkTimer--;
    if(this.hurtTimer>0)this.hurtTimer--;
    if(this.iframes>0)this.iframes--;
    if(this.comboTimer>0){this.comboTimer--;if(this.comboTimer<=0)this.combo=0;}
    if(this.spCD>0)this.spCD--;
    if(this.spActive){this.spTimer--;if(this.spTimer<=0)this.spActive=false;}
    if(!this.attacking&&!this.hurt){
      let mv=false;
      if(keys['ArrowLeft']||keys['KeyA']){this.vx=-PSPD;this.dir=-1;mv=true;}
      else if(keys['ArrowRight']||keys['KeyD']){this.vx=PSPD;this.dir=1;mv=true;}
      else{this.vx*=0.65;}
      if((keys['ArrowUp']||keys['KeyW']||keys['Space'])&&this.grounded){
        this.vy=JF;this.grounded=false;
      }
      if((jp['KeyJ']||jp['KeyZ'])&&this.atkCD<=0){
        this.combo++;this.comboTimer=50;
        this.atkType=this.combo===1?'atk1':this.combo===2?'atk2':'atk3';
        if(this.combo>=3)this.combo=0;
        this.atkTimer=this.atkDur;this.atkCD=this.atkDur+3;this.hitSet.clear();
      }
      if((jp['KeyK']||jp['KeyX'])&&this.atkCD<=0){
        this.atkType='kick';this.atkTimer=this.atkDur+4;
        this.atkCD=this.atkDur+8;this.hitSet.clear();this.combo=0;
      }
      if((jp['KeyL']||jp['ShiftLeft']||jp['ShiftRight'])&&this.sp>=this.maxSp&&this.spCD<=0){
        this.atkType='special';this.atkTimer=32;this.atkCD=36;
        this.sp=0;this.spActive=true;this.spTimer=32;this.spCD=150;
        this.hitSet.clear();
        screenShake=18;
        spawnUltra(this.x,this.y);
      }
      this.state=mv?'walk':'idle';
      if(this.attacking)this.state=this.atkType;
    }else if(this.hurt){this.state='hurt';this.vx*=0.82;}
    if(!this.grounded)this.state='jump';
    this.x+=this.vx;this.y+=this.vy;this.vy+=GRAV;
    if(this.y>=GY){this.y=GY;this.vy=0;this.grounded=true;}
    this.x=clamp(this.x,18,W-18);
    // Hit detection
    const hb=this.hitbox();
    if(hb){
      for(const e of enemies){
        if(e.dead||this.hitSet.has(e.id))continue;
        const ex=e.x-16,ey=e.y-88,ew=32,eh=88;
        if(hb.x<ex+ew&&hb.x+hb.w>ex&&hb.y<ey+eh&&hb.y+hb.h>ey){
          this.hitSet.add(e.id);
          const mult=this.atkType==='special'?3.5:this.combo===0?1.6:1;
          const dmg=Math.floor((this.atkType==='kick'?19:13)*mult);
          e.takeDmg(dmg,this.dir);
          this.sp=Math.min(this.maxSp,this.sp+9);
          const hhCol=this.atkType==='special'?'#39FF14':'#FFD700';
          spawnSlash(e.x,e.y-50,hhCol,this.dir);
          spawnDmg(e.x,e.y-95,`${dmg}`,hhCol);
          if(e.dead)this.score+=ETYPES[e.type].hp*10;
        }
      }
    }
  }
  draw(){
    if(this.spActive){
      ctx.save();const prog=this.spTimer/32;
      const aCols=['#39FF14','#FFD700','#00F5FF'];
      for(let ring=0;ring<3;ring++){
        const r=44+ring*18+Math.sin(this.frame*0.3+ring)*6;
        ctx.globalAlpha=(0.14-ring*0.04)*prog;
        ctx.strokeStyle=aCols[ring];glow(aCols[ring],20);
        ctx.lineWidth=3-ring*0.5;
        ctx.beginPath();ctx.arc(this.x,this.y-42,r,0,Math.PI*2);ctx.stroke();
      }
      noGlow();ctx.restore();
    }
    drawCat(this.x,this.y,this.dir,this.state,this.frame);
    if(this.spActive){
      ctx.save();ctx.globalAlpha=0.25*(this.spTimer/32);
      ctx.strokeStyle='#39FF14';glow('#39FF14',30);ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(this.x,this.y-42,58+Math.sin(this.frame*0.35)*8,0,Math.PI*2);ctx.stroke();
      noGlow();ctx.restore();
    }
  }
}

// ─── ENEMY ────────────────────────────────────
let eid=0;
class Enemy{
  constructor(type,x){
    this.id=++eid;this.type=type;
    const c=ETYPES[type];
    this.x=x;this.y=GY;this.vx=0;this.vy=0;
    this.hp=c.hp;this.maxHp=c.hp;this.spd=c.spd;this.atkDmg=c.atk;
    this.col=c.col;this.dir=-1;
    this.state='chase';this.frame=0;
    this.atkCD=Math.floor(rnd(45,85));
    this.hurtTimer=0;this.iframes=0;
    this.dead=false;this.dying=false;this.dyingT=0;
    this.grounded=true;
  }
  takeDmg(amt,fromDir){
    if(this.iframes>0||this.dead)return;
    this.hp-=amt;this.hurtTimer=14;this.iframes=18;
    this.vx=fromDir*4.5;this.vy=-3.5;this.grounded=false;
    if(this.hp<=0){this.hp=0;this.dead=true;this.dying=true;this.dyingT=48;spawnParts(this.x,this.y-44,this.col,14,7,"star");spawnParts(this.x,this.y-44,this.col,10,10,"spark");}
  }
  update(player){
    this.frame++;
    if(this.atkCD>0)this.atkCD--;
    if(this.hurtTimer>0)this.hurtTimer--;
    if(this.iframes>0)this.iframes--;
    if(this.dying){
      this.dyingT--;this.vy+=GRAV*0.5;
      this.y+=this.vy;this.vx*=0.88;this.x+=this.vx;return;
    }
    this.x+=this.vx;this.y+=this.vy;this.vy+=GRAV;
    if(this.y>=GY){this.y=GY;this.vy=0;this.grounded=true;}
    if(this.hurtTimer>0){this.state='hurt';this.vx*=0.78;return;}
    const dx=player.x-this.x,dist=Math.hypot(dx,player.y-this.y);
    this.dir=dx>0?1:-1;
    const rng=this.type==='dog'?58:48;
    if(dist<rng){
      this.state='atk';this.vx*=0.5;
      if(this.atkCD<=0&&!player.dead){
        player.takeDmg(this.atkDmg);
        this.atkCD=Math.floor(rnd(55,95));
      }
    }else{
      this.state='chase';this.vx=this.dir*this.spd;
    }
    this.x=clamp(this.x,14,W-14);
  }
  draw(){
    const al=this.dying?this.dyingT/45:1;
    if(this.iframes>0&&Math.floor(this.frame/3)%2===0&&!this.dying)ctx.globalAlpha=0.45;
    else ctx.globalAlpha=al;
    ETYPES[this.type].draw(this.x,this.y,this.dir,this.state,this.frame);
    ctx.globalAlpha=1;
    if(!this.dying&&this.hp<this.maxHp){
      const bw=42,bh=4,bx=this.x-21,by=this.y-105;
      ctx.fillStyle='#100820';ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle=this.col;glow(this.col,5);
      ctx.fillRect(bx,by,bw*(this.hp/this.maxHp),bh);noGlow();
    }
  }
}

// ─── BACKGROUND ───────────────────────────────
function drawBG(scroll){
  // Sky
  ctx.fillStyle='#02040A';ctx.fillRect(0,0,W,H);
  // Hex grid
  ctx.strokeStyle='rgba(0,245,255,0.04)';ctx.lineWidth=0.5;
  const hw=24,hh=28;
  for(let gy2=-hh;gy2<H+hh;gy2+=hh){
    for(let gx2=-hw;gx2<W+hw*2;gx2+=hw*1.5){
      const off=Math.floor(gx2/hw/1.5)%2===0?0:hh/2;
      const bx2=(gx2+(scroll*0.1))%(hw*1.5)+hw*(-Math.ceil(W/(hw*1.5)));
      const by2=gy2+off;
      ctx.beginPath();
      ctx.moveTo(bx2+hw/2,by2);ctx.lineTo(bx2+hw,by2+hh/4);ctx.lineTo(bx2+hw,by2+hh*3/4);
      ctx.lineTo(bx2+hw/2,by2+hh);ctx.lineTo(bx2,by2+hh*3/4);ctx.lineTo(bx2,by2+hh/4);ctx.closePath();ctx.stroke();
    }
  }
  // Buildings (silhouette)
  const sc05=scroll*0.05;
  for(let rep=0;rep<3;rep++){
    const offset2=rep*BLDG_TOTAL;
    for(const b of BUILDINGS){
      const bx2=((b.x-sc05)%BLDG_TOTAL+BLDG_TOTAL+offset2)%BLDG_TOTAL-BLDG_TOTAL*0.5;
      if(bx2>W+100)continue;
      ctx.fillStyle=b.c;ctx.fillRect(bx2,GY-b.h-10,b.w,b.h+15);
      // Windows
      for(let wy=GY-b.h-5;wy<GY-18;wy+=14){
        for(let wx=bx2+4;wx<bx2+b.w-6;wx+=10){
          const wc=['#00F5FF','#39FF14','#BF5FFF','#FF6B00','#FFD700'][(wx+wy)%5];
          ctx.fillStyle=wc;ctx.globalAlpha=0.08+Math.sin(wx*0.3+wy*0.2+scroll*0.01)*0.06;
          ctx.fillRect(wx,wy,5,4);
        }
      }
      ctx.globalAlpha=1;
    }
  }
  // Neon signs
  ctx.save();ctx.textAlign='center';ctx.font='bold 11px "Orbitron",monospace';
  const signs=[
    {x:180,y:190,txt:'⚡ CYBER ALLEY',col:'#00F5FF'},
    {x:520,y:175,txt:'☠ RAT MOB HQ',col:'#FF2E4C'},
    {x:760,y:200,txt:'⚠ DANGER ZONE',col:'#FF6B00'},
  ];
  for(const s of signs){
    ctx.fillStyle=s.col;ctx.shadowColor=s.col;
    ctx.shadowBlur=8+Math.sin(scroll*0.02+s.x)*4;
    ctx.globalAlpha=0.35+Math.sin(scroll*0.015+s.x*0.01)*0.08;
    ctx.fillText(s.txt,s.x,s.y);
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
  // Scan lines
  ctx.fillStyle='rgba(0,245,255,0.012)';
  for(let sy=0;sy<H;sy+=4)ctx.fillRect(0,sy,W,1);
  // Ground
  const gg=ctx.createLinearGradient(0,GY-12,0,H);
  gg.addColorStop(0,'#060c1a');gg.addColorStop(1,'#020508');
  ctx.fillStyle=gg;ctx.fillRect(0,GY-12,W,H-GY+12);
  // Ground line glow
  glow('#00F5FF',10);ctx.strokeStyle='rgba(0,245,255,0.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,GY-12);ctx.lineTo(W,GY-12);ctx.stroke();noGlow();
  // Ground grid
  ctx.strokeStyle='rgba(0,245,255,0.07)';ctx.lineWidth=0.7;
  const gs=(scroll*0.3)%80;
  for(let gx2=-gs;gx2<W+80;gx2+=80){
    ctx.beginPath();ctx.moveTo(gx2,GY-12);ctx.lineTo(gx2+50,H);ctx.stroke();
  }
  for(let gy2=GY;gy2<H+40;gy2+=40){
    ctx.beginPath();ctx.moveTo(0,gy2);ctx.lineTo(W,gy2);ctx.stroke();
  }
}

// ─── HUD ──────────────────────────────────────
function drawHUD(player,wave,alive,comboCnt){
  // HP bar
  ctx.fillStyle='rgba(4,6,15,0.8)';ctx.strokeStyle='rgba(0,245,255,0.2)';ctx.lineWidth=1;
  ctx.fillRect(18,16,205,15);ctx.strokeRect(18,16,205,15);
  const hc=player.hp>50?'#39FF14':player.hp>25?'#FFD700':'#FF2E4C';
  glow(hc,8);ctx.fillStyle=hc;ctx.fillRect(19,17,(203)*(player.hp/player.maxHp),13);noGlow();
  ctx.font='10px "Orbitron",monospace';ctx.fillStyle='#C8D8F0';ctx.textAlign='left';
  ctx.fillText(`❤ ${player.hp}/${player.maxHp}`,20,14);
  // Special bar
  ctx.fillStyle='rgba(4,6,15,0.8)';ctx.strokeStyle='rgba(57,255,20,0.2)';
  ctx.fillRect(18,36,205,9);ctx.strokeRect(18,36,205,9);
  const sf=player.sp>=player.maxSp;
  glow(sf?'#39FF14':'transparent',sf?8:0);
  ctx.fillStyle=sf?'#39FF14':'#1a4a22';
  ctx.fillRect(19,37,203*(player.sp/player.maxSp),7);noGlow();
  ctx.font='8px "Orbitron",monospace';
  ctx.fillStyle=sf?'#39FF14':'rgba(57,255,20,0.45)';
  ctx.fillText(sf?'⚡ SPECIAL READY  [L]':`⚡ METER ${Math.floor(player.sp)}/${player.maxSp}`,20,35);
  // Score
  ctx.font='bold 20px "Orbitron",monospace';ctx.textAlign='center';
  glow('#FFD700',12);ctx.fillStyle='#FFD700';ctx.fillText(String(player.score).padStart(7,'0'),W/2,28);noGlow();
  ctx.font='8px "Orbitron",monospace';ctx.fillStyle='rgba(255,215,0,0.45)';ctx.fillText('SCORE',W/2,42);
  // Wave
  ctx.font='bold 14px "Orbitron",monospace';ctx.textAlign='right';
  glow('#00F5FF',8);ctx.fillStyle='#00F5FF';ctx.fillText(`WAVE ${wave}`,W-18,26);noGlow();
  ctx.font='9px "Orbitron",monospace';ctx.fillStyle='rgba(0,245,255,0.45)';
  ctx.fillText(`ENEMIES ${alive}`,W-18,42);
  // Combo
  if(comboCnt>1){
    ctx.save();ctx.font=`bold ${22+comboCnt*3}px "Orbitron",monospace`;ctx.textAlign='center';
    glow('#FFD700',20);ctx.fillStyle='#FFD700';
    ctx.fillText(`${comboCnt}× COMBO!`,W/2,H/2-50);noGlow();ctx.restore();
  }
}

// ─── WAVES ────────────────────────────────────
const WAVES=[
  [{t:'rat',d:20},{t:'rat',d:70},{t:'rat',d:130}],
  [{t:'rat',d:20},{t:'rat',d:60},{t:'dog',d:100},{t:'rat',d:155}],
  [{t:'crow',d:15},{t:'rat',d:55},{t:'crow',d:90},{t:'wolf',d:130}],
  [{t:'dog',d:15},{t:'wolf',d:50},{t:'snake',d:85},{t:'rat',d:120},{t:'crow',d:160}],
  [{t:'wolf',d:15},{t:'snake',d:40},{t:'dog',d:68},{t:'wolf',d:100},{t:'snake',d:135},{t:'rat',d:165}],
];

// ─── GAME STATE ───────────────────────────────
let player,enemies,wave,waveQ,waveT,wClrT,phase,scrollX,gframe;

function initGame(){
  player=new Player();enemies=[];wave=1;
  waveQ=[...WAVES[0]];waveT=0;wClrT=0;
  phase='playing';scrollX=0;gframe=0;
}

function nextWave(){
  wave++;
  const wi=Math.min(wave-1,WAVES.length-1);
  waveQ=WAVES[wi].map(e=>({...e,d:Math.max(12,e.d-(wave-WAVES.length)*5)}));
  if(wave>WAVES.length){
    const ex=wave-WAVES.length;
    const tkeys=Object.keys(ETYPES);
    for(let i=0;i<ex+1;i++)waveQ.push({t:tkeys[Math.floor(Math.random()*tkeys.length)],d:20+i*35});
  }
  waveT=0;
}

// ─── OVERLAY SCREENS ──────────────────────────
function drawTitle(){
  ctx.save();
  ctx.fillStyle='rgba(2,4,10,0.7)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 54px "Orbitron",monospace';
  glow('#39FF14',30);ctx.fillStyle='#39FF14';ctx.fillText('⚡ MEOW WARS ⚡',W/2,H/2-80);noGlow();
  ctx.font='bold 20px "Orbitron",monospace';
  glow('#00F5FF',14);ctx.fillStyle='#00F5FF';ctx.fillText('STREET RIOT',W/2,H/2-38);noGlow();
  ctx.font='11px "Share Tech Mono",monospace';ctx.fillStyle='rgba(200,216,240,0.55)';
  ctx.fillText('A/D · MOVE    W/↑ · JUMP    J · PUNCH    K · KICK    L · SPECIAL',W/2,H/2+20);
  ctx.font='bold 13px "Orbitron",monospace';
  const blink=Math.floor(gframe/22)%2===0;
  if(blink){glow('#FFD700',10);ctx.fillStyle='#FFD700';ctx.fillText('PRESS  J  OR  SPACE  TO  START',W/2,H/2+65);noGlow();}
  // Draw tiny intro characters
  drawCat(W/2-200,H/2+130,1,'idle',gframe);
  drawRat(W/2-80,H/2+130,-1,'chase',gframe);
  drawWolf(W/2+80,H/2+130,-1,'idle',gframe);
  drawCrow(W/2+200,H/2+130,-1,'idle',gframe);
  ctx.restore();
}

function drawWaveClear(){
  const al=wClrT>100?1:wClrT/100;
  ctx.save();ctx.globalAlpha=al;
  ctx.textAlign='center';
  ctx.font='bold 42px "Orbitron",monospace';
  glow('#39FF14',22);ctx.fillStyle='#39FF14';ctx.fillText('WAVE CLEAR!',W/2,H/2-18);noGlow();
  ctx.font='16px "Orbitron",monospace';
  glow('#FFD700',10);ctx.fillStyle='#FFD700';ctx.fillText(`WAVE ${wave+1} INCOMING…`,W/2,H/2+24);noGlow();
  ctx.restore();
}

function drawGameOver(){
  ctx.save();ctx.fillStyle='rgba(2,4,10,0.78)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 52px "Orbitron",monospace';
  glow('#FF2E4C',28);ctx.fillStyle='#FF2E4C';ctx.fillText('💀 GAME OVER',W/2,H/2-60);noGlow();
  ctx.font='bold 24px "Orbitron",monospace';
  glow('#FFD700',12);ctx.fillStyle='#FFD700';ctx.fillText(`SCORE  ${player.score}`,W/2,H/2);noGlow();
  ctx.font='14px "Orbitron",monospace';
  const blink=Math.floor(gframe/22)%2===0;
  if(blink){glow('#00F5FF',10);ctx.fillStyle='#00F5FF';ctx.fillText('PRESS J OR SPACE TO RETRY',W/2,H/2+55);noGlow();}
  ctx.restore();
}

// ─── MAIN LOOP ────────────────────────────────
let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-lastT<15){for(const k in jp)delete jp[k];return;}
  lastT=ts;gframe++;scrollX++;

  // Screen shake translate
  let sx=0,sy=0;
  if(screenShake>0){sx=(Math.random()-.5)*screenShake;sy=(Math.random()-.5)*screenShake;ctx.save();ctx.translate(sx,sy);}

  drawBG(scrollX);

  if(phase==='title'){
    drawTitle();
    if(jp['Space']||jp['KeyJ']||jp['Enter']){initGame();phase='playing';}
  }else if(phase==='playing'){
    // Spawn
    waveT++;
    while(waveQ.length&&waveQ[0].d<=waveT){enemies.push(new Enemy(waveQ.shift().t,W+30));}
    // Update
    for(const e of enemies)e.update(player);
    for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dying&&enemies[i].dyingT<=0)enemies.splice(i,1);
    player.update(enemies);
    updateParts();updateDmgN();
    // Render
    for(const e of enemies)e.draw();
    player.draw();
    drawParts();drawDmgN();
    drawHUD(player,wave,enemies.filter(e=>!e.dead).length,player.combo);
    if(!player.dead&&waveQ.length===0&&enemies.every(e=>e.dead)){phase='waveclear';wClrT=130;}
    if(player.dead)phase='gameover';
  }else if(phase==='waveclear'){
    for(const e of enemies)e.draw();
    player.draw();
    drawParts();drawDmgN();
    drawHUD(player,wave,0,0);
    drawWaveClear();
    wClrT--;
    if(wClrT<=0){nextWave();phase='playing';}
  }else if(phase==='gameover'){
    for(const e of enemies)e.draw();
    player.draw();
    drawDmgN();
    drawHUD(player,wave,0,0);
    drawGameOver();
    if(jp['Space']||jp['KeyJ']||jp['Enter'])initGame();
  }

  if(screenShake>0){ctx.restore();screenShake*=0.82;if(screenShake<0.4)screenShake=0;}
  for(const k in jp)delete jp[k];
}

initGame();phase='title';
requestAnimationFrame(loop);
</script>
